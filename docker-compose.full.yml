# Apply after explicit medical indexing with docker-compose.yml.
services:
  careguide:
    environment:
      CAREGUIDE_MEMORY_MODE: ${CAREGUIDE_MEMORY_MODE:-sqlite}
      CAREGUIDE_MEMORY_EMBEDDING_MODE: remote
      CAREGUIDE_RETRIEVAL_MODE: hybrid
      CAREGUIDE_PERSIST_TRACES: "true"
    depends_on:
      chromadb:
        condition: service_started
